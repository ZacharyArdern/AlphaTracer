name: Build recoded_sketch wheels

on:
  push:
    paths:
      - 'alphatracer/recoded_sketch/**'
    tags:
      - 'sketch-v*'
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x86_64 — manylinux for broad Farm compatibility
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            manylinux: auto
          # macOS Apple Silicon
          - os: macos-14
            target: aarch64-apple-darwin
            manylinux: ''
          # macOS Intel (for older Macs)
          - os: macos-13
            target: x86_64-apple-darwin
            manylinux: ''

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build wheels (Python 3.10, 3.11, 3.12)
        uses: PyO3/maturin-action@v1
        with:
          working-directory: alphatracer/recoded_sketch
          command: build
          args: >-
            --release
            --out dist
            --interpreter python3.10 python3.11 python3.12
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}

      - name: Upload wheels as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.target }}
          path: alphatracer/recoded_sketch/dist/
          if-no-files-found: error

  # Create a GitHub release and attach all wheels when a sketch-v* tag is pushed
  release:
    name: Publish release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/sketch-v')
    permissions:
      contents: write

    steps:
      - name: Download all wheel artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: dist/
          merge-multiple: true

      - name: Create GitHub release and upload wheels
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.whl
          name: recoded_sketch ${{ github.ref_name }}
          body: |
            ## Install

            **Linux (Farm/HPC):**
            ```bash
            pip install https://github.com/ZacharyArdern/AlphaTracer/releases/download/${{ github.ref_name }}/$(ls dist/*linux*cp312*.whl | head -1 | xargs basename)
            ```

            **macOS (Apple Silicon):**
            ```bash
            pip install https://github.com/ZacharyArdern/AlphaTracer/releases/download/${{ github.ref_name }}/$(ls dist/*aarch64*cp312*.whl | head -1 | xargs basename)
            ```

            Or download the `.whl` file for your platform from the assets below and run:
            ```bash
            pip install recoded_sketch-*.whl
            ```
