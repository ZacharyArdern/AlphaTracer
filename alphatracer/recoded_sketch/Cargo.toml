[package]
name = "recoded-sketch"
version = "0.1.0"
edition = "2021"

[lib]
name = "recoded_sketch"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "sketch"
path = "src/create_sketch.rs"

[[bin]]
name = "search"
path = "src/search.rs"

[[bin]]
name = "index-seqs"
path = "src/index_seqs.rs"

[[bin]]
name = "parse-pae"
path = "src/utils/parse_pae.rs"

[dependencies]
rayon = "1"
parquet = { version = "55", features = ["arrow"] }
arrow-array = "55"
arrow-schema = "55"
rustc-hash = "2"
needletail = "0.6"
memmap2 = "0.9"
pyo3 = { version = "0.22", optional = true, features = ["extension-module"] }

[features]
extension-module = ["pyo3/extension-module"]

[profile.release]
opt-level = 3
